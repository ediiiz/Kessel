# Stable channel.
#
# release-please keeps a release PR open that bumps kessel/config.yaml and kessel/CHANGELOG.md from
# the conventional commits on main. Merging it tags the release, and this workflow then publishes the
# images the stable add-on's new version points at.
#
# The images are built here rather than by a tag-triggered workflow because a tag created with
# GITHUB_TOKEN does not start other workflows.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: The add-on version matches the release
        run: |
          set -euo pipefail
          declared="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?.*$/\1/p' kessel/config.yaml)"
          if [ "$declared" != "${{ needs.release-please.outputs.version }}" ]; then
            echo "::error file=kessel/config.yaml::declares $declared, release is ${{ needs.release-please.outputs.version }}"
            exit 1
          fi

  images:
    needs: [release-please, verify]
    uses: ./.github/workflows/build-image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      channel: latest
      ref: ${{ needs.release-please.outputs.tag }}

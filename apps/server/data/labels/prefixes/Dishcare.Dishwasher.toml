# Dishcare.Dishwasher — keys shared by every dishwasher, whatever the brand.

[features."Dishcare.Dishwasher.Setting.EcoAsDefault"]
label = "Default programme"
description = "Which programme is pre-selected when the appliance is switched on."
icon = "mdi:leaf"

# The member names are the two choices, and neither spells itself: "LastProgram" and "EcoAsDefault"
# read as settings rather than as answers to "which programme?".
[features."Dishcare.Dishwasher.Setting.EcoAsDefault".values]
LastProgram = "Whatever ran last"
EcoAsDefault = "Always Eco"


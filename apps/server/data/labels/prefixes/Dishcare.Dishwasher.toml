# --- what an operator watches -----------------------------------------------------------------
#
# `PRIMARY_LEAVES` enables OperationState, DoorState, RemainingProgramTime, ProgramProgress and the
# two programme slots. It does not know about the phase, the consumables, or the reminders — which
# are the rest of what someone asks a dishwasher.

[features."Dishcare.Dishwasher.Status.ProgramPhase"]
label = "Programme phase"
enabled_by_default = true
entity_category = "primary"
icon = "mdi:progress-check"


# Cooking.Hob — the cooktop keys.
#
# **This appliance can be turned on from Home Assistant.** A name that misdescribes a zone is a name
# on a control that heats.
#
# ## The problem this file exists to solve
#
# A derived name is `humanize(last_segment(key))`, and the hob declares its zones as
# `Cooking.Hob.Status.Zone.<NNN>.PowerLevel` — six keys whose last segment is identical. Without a
# contributed name Home Assistant shows **six entities called "Power level"**, distinguishable only
# by the entity id. That is the worst case of the derived fallback in the whole fleet, and no
# spelling transform can fix it: the distinguishing part of the key is not in the leaf.
#
# The zone numbers are the appliance's own (`Zone.100`, `.120`, `.200`, `.300`, `.340`, `.400`) and
# they are **not** positions — `Cooking.Hob.Status.Zone.<NNN>.Position` is a separate feature the
# appliance reports at run time. So the names below carry the number, not a guess at where the ring
# is. Naming one "front left" without having stood in front of this cooktop would be an invented
# fact, and on a hob it is the invented fact that turns on the wrong ring.
#
# Nothing here is promoted to `enabled_by_default`. `PRIMARY_LEAVES` already enables each zone's
# `OperationState`, and six power levels plus six programme progresses on the prominent page is not
# an improvement — they are one click away under the disabled list.

[features."Cooking.Hob.Status.Zone.100.PowerLevel"]
label = "Zone 100 power level"
icon = "mdi:fire"


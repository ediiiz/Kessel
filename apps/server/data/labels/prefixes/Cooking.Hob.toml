# --- the extractor --------------------------------------------------------------------------
#
# This hob has an integrated extractor hood. Its ventilation and filter are the settings an operator
# reaches for, and the saturation warnings are worth an automation.

[features."Cooking.Hob.Setting.Ventilation"]
label = "Extractor"
enabled_by_default = true
entity_category = "primary"

[features."Cooking.Hob.Setting.VentilationAutomaticStart"]
label = "Extractor starts automatically"

[features."Cooking.Hob.Setting.VentilationAfterRun"]
label = "Extractor run-on time"

[features."Cooking.Hob.Setting.AirCirculationMode"]
label = "Air circulation mode"

[features."Cooking.Hob.Setting.AirQualitySensorSensitivity"]
label = "Air quality sensor sensitivity"

[features."Cooking.Hob.Status.CarbonFilterSaturation"]
label = "Carbon filter saturation"
enabled_by_default = true
icon = "mdi:air-filter"

[features."Cooking.Hob.Command.CarbonFilterReset"]
label = "Reset the carbon filter counter"
icon = "mdi:air-filter"

[features."Cooking.Hob.Event.CarbonFilterMaxSaturationReached"]
label = "Carbon filter saturated"
enabled_by_default = true
entity_category = "primary"
device_class = "problem"

[features."Cooking.Hob.Event.CarbonFilterMaxSaturationNearlyReached"]
label = "Carbon filter nearly saturated"
enabled_by_default = true
device_class = "problem"


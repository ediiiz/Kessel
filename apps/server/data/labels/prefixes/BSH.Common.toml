# BSH.Common — the keys every Home Connect appliance shares.
#
# The prefix layer. Anything named here applies to all four appliances unless a model file overrides
# it. Only keys whose derived spelling is wrong or uninformative are listed; `Setting.PowerState`
# spells itself correctly and is deliberately absent.

[features."BSH.Common.Status.OperationState"]
label = "Operation state"
icon = "mdi:state-machine"

[features."BSH.Common.Status.RemoteControlStartAllowed"]

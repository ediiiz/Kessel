# --- the two programmes the oven declares twice --------------------------------------------------
#
# The oven declares 298 programmes, of which 42 leaf names appear twice. `presentation`'s uniqueness
# rule leaves every colliding pair publishing its raw key, so nothing is ambiguous — but a raw key in
# a dropdown is a name nobody wants to read, and these two pairs are the ones an operator meets in
# ordinary use rather than somewhere in the dish catalogue.
#
# The qualifier is the key's own distinguishing segment and nothing more. `SubsequentMode` is what
# the oven calls the mode it runs *after* a programme finishes; `Cleaning` is the pyrolysis group.
# What either one does beyond that is not documented anywhere we can cite, so it is not claimed here.
#
# The remaining 40 collisions are all `Dish.Automatic.*` against `Dish.Recommendation.*.MeatProbe.*`
# — the same dish by a different method. Telling those apart in a name needs someone who has cooked
# on the appliance, so they are left on their raw keys deliberately.

[programs."Cooking.Oven.Program.HeatingMode.KeepWarm"]
label = "Keep warm"

[programs."Cooking.Oven.Program.SubsequentMode.KeepWarm"]
label = "Keep warm (subsequent mode)"

[programs."Cooking.Oven.Program.Cleaning.Drying"]
label = "Drying (cleaning)"


# Cooking.Oven — the oven keys.
#
# **This appliance can be started from Home Assistant.** A misleading name here is a misleading name
# on a control that heats.
#
# ## Two things shape this file
#
# 1. **Everything lives under `Cavity.001`.** The derived name is `humanize(last_segment(key))`, so
#    the cavity segment vanishes and the leaf is what shows. That is usually fine — this oven has one
#    cavity — but it means `Status.Cavity.001.DoorState` and `Status.Server.Cavity.001.DoorState`
#    both render as "Door state", and likewise for `OperationState`, `SteamBoost` and
#    `SteamAssistLevel`.
#
# 2. **`Status.Server.*` is not for people.** Those 22 keys are the appliance's telemetry to BSH's
#    cloud — a baking-sensor oxygen reading, a forecast data package, a Pt500 probe. They are named
#    here only so they are distinguishable from their user-facing twins, and they stay disabled and
#    Diagnostic.
#
# This oven declares 288 addressable entities. Ten or so are promoted below; the rest arrive
# disabled, which is not hidden — the config is published and one click turns it on.

# --- what you came for ----------------------------------------------------------------------
#
# `PRIMARY_LEAVES` already enables OperationState, DoorState, RemainingProgramTime, ProgramProgress,
# StartInRelative and the two programme slots. It does not know about temperature, which on an oven
# is the number.

[features."Cooking.Oven.Status.Cavity.001.CurrentTemperature"]
label = "Oven temperature"
enabled_by_default = true
entity_category = "primary"
icon = "mdi:thermometer"

[features."Cooking.Oven.Status.Cavity.001.SetpointTemperature"]
